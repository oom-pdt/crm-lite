<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Lite</title>
  <meta name="description" content="CRM Lite prototype: leads, attribution and revenue logging. All data is placeholder.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Radio+Canada+Big:wght@400;500;700&display=swap">
  <script src="https://unpkg.com/lucide@0.546.0/dist/umd/lucide.min.js"></script>
  <!-- build:css -->
  <link rel="stylesheet" href="src/styles.css">
  <!-- /build:css -->
</head>
<body>
  <header class="devbar" id="devbar"></header>

  <div class="app">
    <nav class="rail glass" id="rail" aria-label="Main"></nav>
    <main class="main" id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- build:js (order matters: each file is a classic script sharing globals) -->
  <script src="src/data.js"></script>
  <script src="src/core.js"></script>
  <script src="src/daterange.js"></script>
  <script src="src/opps.js"></script>
  <script src="src/leads.js"></script>
  <script src="src/dupes.js"></script>
  <script src="src/lost.js"></script>
  <script src="src/journey.js"></script>
  <script src="src/users.js"></script>
  <script src="src/app.js"></script>
  <!-- /build:js -->
</body>
</html>
