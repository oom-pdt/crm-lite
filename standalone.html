// Leads list with the summary tiles, the add-lead dialog, and the lead page.

// ---- Leads list -------------------------------------------------------------
function leadsPage() {
  const ui = state.ui, admin = isAdmin();
  const leads = visibleLeads();
  return `
    <header class="page-head">
      <div><h1>Leads</h1><p class="sub">${admin ? 'Every lead in the organisation' : 'Leads assigned to you'}</p></div>
      <button class="btn btn-primary" onclick="leadOpenAdd()">${icon('add')}Add lead</button>
    </header>
    ${leadsSummaryHTML(leads)}
    <section class="card">
      <div class="toolbar">
        <div class="search">${icon('search')}<input class="input" id="lead-q" placeholder="Search name, email or phone" value="${esc(ui.q)}" oninput="leadSetFilter('q', this.value)" aria-label="Search leads"></div>
        ${selectHTML('lead-f-status', [['', 'All statuses'], ...LEAD_STATUSES], ui.status, `onchange="leadSetFilter('status', this.value)" aria-label="Filter by status"`)}
        ${selectHTML('lead-f-source', [['', 'All sources'], ...LEAD_SOURCES], ui.source, `onchange="leadSetFilter('source', this.value)" aria-label="Filter by source"`)}
        <div class="drp" id="drp-leads">${drpHTML('leads')}</div>
        ${admin ? selectHTML('lead-f-assignee', [['', 'All assignees'], ['none', 'Unassigned'], ...DB.users.map(u => [u.id, u.name])], ui.assignee, `onchange="leadSetFilter('assignee', this.value)" aria-label="Filter by assignee"`) : ''}
      </div>
      <div id="lead-results">${leadsResultsHTML()}</div>
    </section>`;
}

function leadsSummaryHTML(leads) {
  const ltv = ltvMap();
  const won = leads.reduce((s, l) => s + (ltv[l.id] || 0), 0);
  const converted = leads.filter(l => l.status === 'Converted').length;
  const tile = (label, value, note) => `<div class="card tile"><div class="tile-label">${label}</div><div class="tile-value">${value}</div><div class="tile-note">${note}</div></div>`;
  return `
    <div class="tiles">
      ${tile('Leads', leads.length, 'All time')}
      ${tile('Converted', converted, leads.length ? `${Math.round(converted / leads.length * 100)}% of leads` : '—')}
      ${tile('Won revenue', fmtMoney(won), 'From won deals')}
    </div>`;
}

// The line under the source pill. Manually added leads say so, because that is what decides whether they can be deleted.
function sourceNote(l) {
  const detail = l.attribution.sourceDetail || l.attribution.campaign;
  return l.origin === 'manual' ? ['Added manually', detail].filter(Boolean).join(' · ') : detail;
}

function leadsFiltered() {
  const ui = state.ui, q = ui.q.trim().toLowerCase();
  return visibleLeads().filter(l =>
    (!q || l.name.toLowerCase().includes(q) || emailsOf(l).some(e => e.includes(q)) || phonesOf(l).some(p => p.replace(/\s/g, '').includes(q.replace(/\s/g, '')))) &&
    (!ui.status || l.status === ui.status) &&
    (!ui.source || l.source === ui.source) &&
    dateMatch(ui.dates.leads, l.createdAt) &&
    (!ui.assignee || (ui.assignee === 'none' ? !l.assigneeId : l.assigneeId === ui.assignee))
  ).sort((a, b) => b.createdAt - a.createdAt);
}

function leadsResultsHTML() {
  const rows = leadsFiltered(), ltv = ltvMap(), admin = isAdmin();
  // Only leads that are in view can stay selected, so a bulk action never touches rows the user can't see.
  const inView = new Set(rows.map(l => l.id));
  state.ui.selected = state.ui.selected.filter(id => inView.has(id));
  const sel = new Set(state.ui.selected);
  if (!rows.length) return `<div class="empty">${visibleLeads().length ? 'No leads match these filters.' : 'No leads are assigned to you yet.'}</div>`;
  return `${bulkBarHTML(sel.size)}<div class="table-wrap"><table>
    <thead><tr><th class="sel"><input type="checkbox" class="chk" id="lead-sel-all" onchange="leadToggleAll(this.checked)" aria-label="Select all leads shown"${sel.size === rows.length ? ' checked' : ''}></th><th>Lead</th><th class="hide-sm">Source</th><th class="hide-sm">Status</th>${admin ? '<th class="hide-sm">Assignee</th>' : ''}<th class="hide-sm">Created</th><th class="num">Lifetime value</th></tr></thead>
    <tbody>${rows.map(l => `<tr class="is-link${sel.has(l.id) ? ' is-selected' : ''}" onclick="navigate('#/leads/${l.id}')">
      <td class="sel" onclick="event.stopPropagation()"><input type="checkbox" class="chk" onchange="leadToggle('${l.id}', this.checked)" aria-label="Select ${esc(l.name)}"${sel.has(l.id) ? ' checked' : ''}></td>
      <td><a class="cell-main" href="#/leads/${l.id}" onclick="event.stopPropagation()">${esc(l.name)}</a>${dupMap()[l.id] ? ' <span class="pill pill-duplicate">Possible duplicate</span>' : ''}<div class="cell-sub hide-sm">${esc(l.email || '—')}</div><div class="show-sm">${pill(l.source)} ${pill(l.status)}${l.origin === 'manual' ? '<div class="cell-sub">Added manually</div>' : ''}</div></td>
      <td class="hide-sm">${pill(l.source)}${sourceNote(l) ? `<div class="cell-sub">${esc(sourceNote(l))}</div>` : ''}</td>
      <td class="hide-sm">${pill(l.status)}</td>
      ${admin ? `<td class="hide-sm${l.assigneeId ? '' : ' muted'}">${esc(userName(l.assigneeId))}</td>` : ''}
      <td class="hide-sm">${fmtDate(l.createdAt)}</td>
      <td class="num">${ltv[l.id] ? `<strong>${fmtMoney(ltv[l.id])}</strong>` : '<span class="muted">—</span>'}</td>
    </tr>`).join('')}</tbody></table></div>
    <div class="count">${rows.length} of ${visibleLeads().length} leads</div>`;
}

// ---- Bulk actions -----------------------------------------------------------
// Assign and Delete are admin only. Anyone can change the status of leads they can see.
// Only manually created leads can be deleted; the delete dialog says so when the selection includes others.
function bulkBarHTML(n) {
  if (!n) return '';
  const admin = isAdmin();
  return `<div class="bulk-bar" role="group" aria-label="Bulk actions"><strong>${n} selected</strong>
    ${admin ? selectHTML('bulk-assign', [['', 'Assign to…'], ['none', 'Unassigned'], ...DB.users.map(u => [u.id, u.name])], '', `onchange="leadBulkAssign(this.value)" aria-label="Assign selected leads"`) : ''}
    ${selectHTML('bulk-status', [['', 'Change status…'], ...LEAD_STATUSES], '', `onchange="leadBulkStatus(this.value)" aria-label="Change status of selected leads"`)}
    ${admin ? `<button class="btn btn-delete" onclick="leadBulkDeleteAsk()">${icon('del')}Delete</button>` : ''}
    <button class="btn" onclick="leadClearSel()">Clear</button>
  </div>`;
}
const leadCount = n => `${n} ${n === 1 ? 'lead' : 'leads'}`;
function selectedLeads() { return DB.leads.filter(l => state.ui.selected.includes(l.id) && canSeeLead(l)); }

function leadRefreshResults() {
  document.getElementById('lead-results').innerHTML = leadsResultsHTML();
  refreshIcons();
  leadSyncSelectAll();
}
// The header checkbox is half-filled when only some of the shown leads are selected.
function leadSyncSelectAll() {
  const box = document.getElementById('lead-sel-all');
  if (box) box.indeterminate = state.ui.selected.length > 0 && !box.checked;
}
function leadToggle(id, on) {
  const s = new Set(state.ui.selected);
  if (on) s.add(id); else s.delete(id);
  state.ui.selected = [...s];
  leadRefreshResults();
}
function leadToggleAll(on) { state.ui.selected = on ? leadsFiltered().map(l => l.id) : []; leadRefreshResults(); }
function leadClearSel() { state.ui.selected = []; leadRefreshResults(); }

function leadBulkStatus(status) {
  const leads = selectedLeads();
  if (!status || !leads.length) return;
  let n = 0;
  if (status === 'Lost') {
    const targets = leads.filter(l => l.status !== 'Lost');
    if (!targets.length) { toast('Already Lost'); render(); return; }
    leadsMarkLost(targets, true);
    render();   // puts the dropdown back until the reason is confirmed
    return;
  }
  leads.forEach(l => { if (l.status !== status) { leadApplyStatus(l, status); n++; } });
  state.ui.selected = [];
  toast(n ? `${leadCount(n)} changed to ${status}` : `Already ${status}`);
  render();
}
function leadBulkAssign(value) {
  const leads = selectedLeads();
  if (!isAdmin() || !value || !leads.length) return;
  const next = value === 'none' ? null : value;
  let n = 0;
  leads.forEach(l => { if (l.assigneeId !== next) { logActivity(l.id, 'assignee_changed', 'Assignee changed', `${userName(l.assigneeId)} → ${userName(next)}`); l.assigneeId = next; stamp(l, 'assigneeId'); n++; } });
  state.ui.selected = [];
  toast(n ? `${leadCount(n)} ${next ? `assigned to ${userName(next)}` : 'unassigned'}` : 'No change');
  render();
}
function leadBulkDeleteAsk() {
  const leads = selectedLeads();
  if (!isAdmin() || !leads.length) return;
  const manual = leads.filter(l => l.origin === 'manual'), n = leads.length, m = manual.length;
  if (!m) {
    openModal(`Can't delete ${leadCount(n)}`,
      `<p><strong>Only manually created leads can be deleted.</strong> ${n === 1 ? "The selected lead wasn't" : `None of the ${n} selected leads were`} created manually, so nothing will be deleted.</p>`,
      `<button class="btn btn-primary" onclick="closeModal()">OK</button>`);
    return;
  }
  const ids = new Set(manual.map(l => l.id));
  const opps = DB.opps.filter(o => ids.has(o.leadId)), won = opps.filter(o => o.status === 'Won').reduce((t, o) => t + o.value, 0);
  const warning = m < n ? `<p><strong>Only manually created leads can be deleted.</strong> ${m} of the ${n} selected leads ${m === 1 ? 'is' : 'are'} manually created, so only ${m === 1 ? 'that one' : `those ${m}`} will be deleted. The other ${n - m} will be kept.</p>` : '';
  openModal(`Delete ${leadCount(m)}?`,
    `${warning}<p>This permanently removes ${m === 1 ? 'this lead' : 'these leads'}, ${opps.length} ${opps.length === 1 ? 'deal' : 'deals'} (${fmtMoney(won)} won revenue) and their timelines. It can't be undone.</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-delete" onclick="leadBulkDeleteDo()">Delete ${leadCount(m)}</button>`);
}
function leadBulkDeleteDo() {
  if (!isAdmin()) return;
  const ids = new Set(selectedLeads().filter(l => l.origin === 'manual').map(l => l.id));
  DB.leads = DB.leads.filter(l => !ids.has(l.id));
  DB.opps = DB.opps.filter(o => !ids.has(o.leadId));
  DB.activities = DB.activities.filter(a => !ids.has(a.leadId));
  state.ui.selected = [];
  closeModal();
  toast(`${leadCount(ids.size)} deleted`);
  render();
}

// Filters refresh only the results, so the search box keeps focus while typing.
function leadSetFilter(key, value) {
  state.ui[key] = value;
  leadRefreshResults();
}

// ---- Attribution fields (shared by the add dialog and the lead page) --------
function attrFieldsHTML(prefix, source, attr) {
  return ATTR_FIELDS.map(f => `<div class="field" data-attr="${f.key}"${SOURCE_FIELDS[source].includes(f.key) ? '' : ' hidden'}><label class="field-label" for="${prefix}-${f.key}">${f.label}</label>${inputHTML(`${prefix}-${f.key}`, attr[f.key] || '')}</div>`).join('');
}
// Shows only the attribution fields that apply to the chosen source.
function attrToggle(prefix, source) {
  ATTR_FIELDS.forEach(f => { document.getElementById(`${prefix}-${f.key}`).closest('.field').hidden = !SOURCE_FIELDS[source].includes(f.key); });
}
function attrRead(prefix, source) {
  const a = {};
  ATTR_FIELDS.forEach(f => { a[f.key] = SOURCE_FIELDS[source].includes(f.key) ? val(`${prefix}-${f.key}`) : ''; });
  return a;
}
function leadValidate(d, exceptId) {
  if (!d.name) return 'Enter a name.';
  if (!d.email && !d.phone) return 'Enter an email or a phone number.';
  if (d.email && !validEmail(d.email)) return 'Enter a valid email address.';
  if (d.moreEmails.length && !d.email) return 'Add a primary email before adding more.';
  if (d.morePhones.length && !d.phone) return 'Add a primary phone number before adding more.';
  if (d.moreEmails.some(e => !validEmail(e.value))) return 'Enter a valid additional email address.';
  return '';
}

// Emails and phone numbers. With one value it is a plain field plus an "Add another" button. Once a second is added the field becomes a
// list headed "Emails" (or "Phone numbers"): each row is an editable title and its value, starting with Primary, then Secondary.
// The first row is always the primary one.
const CONTACT_KINDS = {
  email: { head: 'Emails', single: 'Email', type: 'email', add: 'Add another email' },
  phone: { head: 'Phone numbers', single: 'Phone', type: 'tel', add: 'Add another phone number' }
};
function contactEditHTML(prefix, kind, st) {
  const k = CONTACT_KINDS[kind], id = `${prefix}-${kind}`;
  const addBtn = `<button type="button" class="btn btn-more" onclick="contactAdd('${prefix}', '${kind}')">${icon('add')}${k.add}</button>`;
  if (!st.more.length && !st.expanded) {
    return `<div class="field span-2 ce" id="${id}-ce" data-label="${esc(st.label)}"><label class="field-label" for="${id}">${k.single}</label>${inputHTML(id, st.value, `type="${k.type}"`)}${addBtn}</div>`;
  }
  const row = (label, value, primary, n) => `<div class="ce-row"><input class="input ce-label" value="${esc(label)}" aria-label="${k.single} ${n} title">
    <input class="input ce-value"${primary ? ` id="${id}"` : ''} type="${k.type}" value="${esc(value)}" aria-label="${k.single} ${n}">
    ${primary ? '<span class="ce-gap"></span>' : `<button type="button" class="btn btn-icon" onclick="contactRemove(this)" aria-label="Remove ${k.single.toLowerCase()} ${n}">${icon('del')}</button>`}</div>`;
  return `<div class="field span-2 ce ce-multi" id="${id}-ce"><div class="field-label">${k.single}</div>
    ${row(st.label, st.value, true, 1)}${st.more.map((m, i) => row(m.label, m.value, false, i + 2)).join('')}${addBtn}</div>`;
}
// What the editor currently shows, read back from the page.
function contactState(prefix, kind) {
  const box = document.getElementById(`${prefix}-${kind}-ce`);
  if (!box.classList.contains('ce-multi')) return { label: box.dataset.label, value: val(`${prefix}-${kind}`), more: [] };
  const rows = [...box.querySelectorAll('.ce-row')].map(r => ({ label: r.querySelector('.ce-label').value.trim(), value: r.querySelector('.ce-value').value.trim() }));
  return { label: rows[0].label, value: rows[0].value, more: rows.slice(1), expanded: true };
}
function contactAdd(prefix, kind) {
  const st = contactState(prefix, kind);
  if (!st.label) st.label = defaultContactLabel(0);
  st.more.push({ label: defaultContactLabel(st.more.length + 1), value: '' });
  st.expanded = true;
  document.getElementById(`${prefix}-${kind}-ce`).outerHTML = contactEditHTML(prefix, kind, st);
  refreshIcons();
  document.getElementById(`${prefix}-${kind}-ce`).querySelector('.ce-row:last-of-type .ce-value').focus();
}
function contactRemove(btn) { btn.closest('.ce-row').remove(); }
// Blank rows are dropped, and so are repeats of the primary or of each other. A blank title falls back to its default.
function contactRead(prefix, kind) {
  const st = contactState(prefix, kind), key = kind === 'email' ? emailKey : p => phoneKey(p) || p.trim();
  const fix = v => kind === 'email' ? v.toLowerCase() : v;
  const seen = new Set([key(st.value)]), more = [];
  st.more.forEach(m => { if (m.value && !seen.has(key(m.value))) { seen.add(key(m.value)); more.push({ label: m.label || defaultContactLabel(more.length + 1), value: fix(m.value) }); } });
  return { label: st.label || 'Primary', value: fix(st.value), more };
}

// Changing the status is its own action and saves straight away.
function leadSetStatus(id, status) {
  const l = DB.leads.find(x => x.id === id);

  if (status === 'Lost') { leadsMarkLost([l], false); render(); return; }   // render puts the dropdown back until the reason is confirmed
  leadApplyStatus(l, status);
  toast(`Status set to ${status}`);
  render();
}

// Sets a status and logs it. A lost reason is kept only while the lead is Lost.
function leadApplyStatus(l, status, lost) {
  logActivity(l.id, 'status_changed', 'Status changed', `${l.status} → ${status}${lost ? `. ${lostText(lost.reason, lost.note)}` : ''}`);
  l.status = status; stamp(l, 'status');
  l.lostReason = lost ? lost.reason : ''; l.lostNote = lost ? lost.note : '';
}
function leadsMarkLost(leads, bulk) {
  const n = leads.length;

    title: n === 1 ? 'Mark lead as lost' : `Mark ${n} leads as lost`,
    intro: n === 1 ? `${leads[0].name} stays in your list as Lost. Say why, so your team can learn from it.` : `These ${n} leads stay in your list as Lost. Say why, so your team can learn from it.`,
    reasons: LEAD_LOST_REASONS,

const CONTACT_LABELS = { call: 'Call', sms: 'SMS', whatsapp: 'WhatsApp', telegram: 'Telegram', email: 'Email', meeting: 'Meeting' };

function leadContactClicked(kind, id) { setTimeout(() => leadContactLog(kind, id), 150); }

// "Add activity" in the timeline: log a note, or a call, message, email or meeting that happened outside the app.

function leadActivitySave(id) {

// A free-text notes field for anything that doesn't fit elsewhere. The box is always there: clicking it makes it active (blue outline)
// and it saves when you click away (Esc discards, Ctrl/Cmd+Enter saves). Formatting is rendered while the box is not active,
// because a textarea can only show the raw text.
const NOTES_PLACEHOLDER = 'Anything worth remembering about this lead';
function leadNotesBodyHTML(l) {
  const open = `onclick="if (!event.target.closest('a')) leadNotesOpen('${l.id}')" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); leadNotesOpen('${l.id}'); }"`;
  return `<div class="notes-text${l.notes ? '' : ' is-empty'}" tabindex="0" role="button" aria-label="Notes" ${open}>${l.notes ? mdHTML(l.notes) : NOTES_PLACEHOLDER}</div>`;
}
function leadNotesHTML(l) {
  return `<section class="card"><div class="card-head"><h2>Notes</h2></div><div id="lead-notes-body">${leadNotesBodyHTML(l)}</div></section>`;
}
function leadNotesOpen(id) {
  const l = DB.leads.find(x => x.id === id);
  document.getElementById('lead-notes-body').innerHTML = `<textarea class="textarea" id="lead-notes" maxlength="5000" aria-label="Notes" placeholder="${NOTES_PLACEHOLDER}"
      oninput="leadNotesFit(this)" onblur="leadNotesClose('${id}', true)" onkeydown="leadNotesKey(event, '${id}')">${esc(l.notes || '')}</textarea>`;
  const el = document.getElementById('lead-notes');
  leadNotesFit(el); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
}
// The box grows with what is typed, so it never scrolls inside itself and opening it doesn't change its size.
function leadNotesFit(el) { el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight + 2, 76) + 'px'; }
function leadNotesKey(e, id) {
  if (e.key === 'Escape') { e.stopPropagation(); leadNotesClose(id, false); }
  else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') leadNotesClose(id, true);
}
// Closing never re-renders the page, so a click that made the box lose focus still lands on whatever was clicked.
function leadNotesClose(id, save) {
  const el = document.getElementById('lead-notes');
  if (!el) return;
  const l = DB.leads.find(x => x.id === id), next = el.value.trim(), changed = save && next !== (l.notes || '');
  el.onblur = null;   // taking the box out fires one more blur
  if (changed) {
    l.notes = next;
    const entry = logActivity(id, 'lead_updated', 'Notes updated', '');
    if (!state.ui.keyMoments) document.getElementById('timeline').insertAdjacentHTML('afterbegin', leadEventHTML(entry));
    document.getElementById('tl-count').textContent = timelineView(id).count;
    toast('Notes saved');
  }
  document.getElementById('lead-notes-body').innerHTML = leadNotesBodyHTML(l);
  refreshIcons();
}
function leadEdit(on) { state.ui.editing = on; render(); }

function leadSave(id) {
  const l = DB.leads.find(x => x.id === id);
  const em = contactRead('le', 'email'), ph = contactRead('le', 'phone');
  // Source, contact channel and attribution are fixed once a lead exists, so they are carried over as they are.
  const d = {
    name: val('le-name'), email: em.value, phone: ph.value, source: l.source,
    emailLabel: em.label, phoneLabel: ph.label, moreEmails: em.more, morePhones: ph.more,
    attribution: l.attribution, contactChannel: l.contactChannel
  };
  const err = leadValidate(d, id);
  if (err) { document.getElementById('le-error').textContent = err; return; }

  const labels = { name: 'name', email: 'email', phone: 'phone' };
  const changed = Object.keys(labels).filter(k => l[k] !== d[k]).map(k => labels[k]);
  const sig = (label, more) => JSON.stringify([label, more]);
  if (sig(l.emailLabel || 'Primary', l.moreEmails || []) !== sig(d.emailLabel, d.moreEmails)) changed.push('additional emails');
  if (sig(l.phoneLabel || 'Primary', l.morePhones || []) !== sig(d.phoneLabel, d.morePhones)) changed.push('additional phone numbers');
  if (changed.length) logActivity(id, 'lead_updated', 'Details edited', `Updated ${changed.join(', ')}`);
  MERGE_FIELDS.filter(f => f in d && l[f] !== d[f]).forEach(f => stamp(l, f));
  Object.assign(l, d);
  state.ui.editing = false;
  toast(duplicatesOf(l).length ? 'Lead saved. It may be a duplicate.' : 'Lead saved');
  render();
}

// Reassigning is its own action (admin only) and saves straight away.
function leadAssign(id, userId) {
  if (!isAdmin()) return;
  const l = DB.leads.find(x => x.id === id), next = userId || null;
  if (l.assigneeId === next) return;
  logActivity(id, 'assignee_changed', 'Assignee changed', `${userName(l.assigneeId)} → ${userName(next)}`);
  l.assigneeId = next; stamp(l, 'assigneeId');
  toast(next ? `Assigned to ${userName(next)}` : 'Lead unassigned');
  render();
}



// ---- src/dupes.js ----
// Duplicate handling: matching incoming leads to existing ones, spotting duplicates later, and merging them.

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// ---- Matching ---------------------------------------------------------------
// Two leads are the same person when they share an email (ignoring case) or a phone number (last 8 digits).
// Any of a lead's emails or phone numbers can match, not just the primary ones.
const shareKey = (x, y) => x.some(k => k && y.includes(k));
function matchReason(a, b) {
  const e = shareKey(emailsOf(a).map(emailKey), emailsOf(b).map(emailKey));
  const p = shareKey(phonesOf(a).map(phoneKey), phonesOf(b).map(phoneKey));
  return e && p ? 'email and phone number' : e ? 'email' : p ? 'phone number' : '';
}
// Other leads the current user can see that look like the same person.
function duplicatesOf(l) { return visibleLeads().filter(x => x.id !== l.id && matchReason(l, x)); }
// Lead ids that have a possible duplicate, for flagging them in the list.
function dupMap() {
  const byKey = {}, flagged = {};
  visibleLeads().forEach(l => new Set([...emailsOf(l).map(e => `e${emailKey(e)}`), ...phonesOf(l).map(p => `p${phoneKey(p)}`)]).forEach(k => { if (k.length > 1) (byKey[k] = byKey[k] || []).push(l.id); }));
  Object.values(byKey).forEach(ids => { if (ids.length > 1) ids.forEach(id => { flagged[id] = true; }); });
  return flagged;
}

// Everyone linked to this lead through a shared email or phone number, directly or through another duplicate.
function dupGroup(l) {
  const vis = visibleLeads(), seen = new Set([l.id]), queue = [l];
  while (queue.length) { const cur = queue.shift(); vis.forEach(x => { if (!seen.has(x.id) && matchReason(cur, x)) { seen.add(x.id); queue.push(x); } }); }
  return vis.filter(x => seen.has(x.id)).sort((a, b) => a.createdAt - b.createdAt);
}

function dupBannerHTML(l) {
  const ds = duplicatesOf(l);
  if (!ds.length) return '';
  const group = dupGroup(l);
  return `<div class="notice" role="alert">${icon('warn')}<div><strong>Possible duplicate${ds.length > 1 ? 's' : ''}</strong>
    ${ds.map(d => `<div class="notice-row"><span><a href="#/leads/${d.id}">${esc(d.name)}</a> has the same ${matchReason(l, d)}.</span><button class="btn" onclick="mergeOpen('${l.id},${d.id}')">${icon('merge')}Merge</button></div>`).join('')}
    ${group.length > ds.length + 1 ? `<div class="notice-row"><span>${group.length} leads are linked by shared details.</span><button class="btn" onclick="mergeOpen('${group.map(g => g.id).join(',')}')">${icon('merge')}Merge all ${group.length}</button></div>` : ''}
  </div></div>`;
}

// ---- Merging ----------------------------------------------------------------
// Any number of leads (2 or more). The earliest-created lead is kept and the rest are folded into it.
// For each field the dialog proposes the most recently updated value, and the person can pick a different one.
const MERGE_LABELS = { name: 'Name', email: 'Email', phone: 'Phone', status: 'Status', assigneeId: 'Assignee' };
const mergeShow = (f, v) => f === 'assigneeId' ? (v ? userName(v) : 'Unassigned') : (v || '—');
const fieldStamp = (l, f) => (l.fieldUpdated && l.fieldUpdated[f]) || l.createdAt;
const isEmpty = v => v == null || v === '';

// Default choice per field: the latest updated value. An empty value never beats a filled one; ties go to the earlier lead.
function mergePlan(leads) {
  const sorted = leads.slice().sort((a, b) => a.createdAt - b.createdAt);
  const choice = {};
  MERGE_FIELDS.forEach(f => {
    const filled = sorted.filter(l => !isEmpty(l[f]));
    choice[f] = (filled.length ? filled : sorted).reduce((a, b) => fieldStamp(b, f) > fieldStamp(a, f) ? b : a).id;
  });
  return { sorted, survivor: sorted[0], others: sorted.slice(1), choice };
}
// What a field's dropdown offers: each distinct filled value once. The dropdown starts on the latest value; people can pick another.
function mergeOptions(plan, f) {
  const same = v => f === 'email' ? String(v).toLowerCase() : String(v);   // emails that differ only by case are one value
  const byValue = new Map();
  plan.sorted.forEach(l => { if (!isEmpty(l[f])) { const k = same(mergeShow(f, l[f])); if (!byValue.has(k) || l.id === plan.choice[f]) byValue.set(k, l); } });
  return [...byValue.values()].map(l => [l.id, mergeShow(f, l[f])]);
}
function mergeLeads(csv) {
  const leads = String(csv).split(',').map(id => DB.leads.find(x => x.id === id));
  return leads.length >= 2 && leads.every(l => l && canSeeLead(l)) && new Set(leads).size === leads.length ? leads : null;
}

function mergeOpen(csv) {
  const leads = mergeLeads(csv);
  if (!leads) return;
  const plan = mergePlan(leads), ids = new Set(leads.map(l => l.id));
  const acts = DB.activities.filter(x => ids.has(x.leadId)).length, opps = DB.opps.filter(o => ids.has(o.leadId)).length;
  const row = f => {
    const opts = mergeOptions(plan, f);
    const after = opts.length > 1 ? selectHTML('mg-' + f, opts, plan.choice[f], `aria-label="After merge: ${MERGE_LABELS[f]}"`) : `<div class="value-pill">${esc(mergeShow(f, plan.sorted.find(l => l.id === plan.choice[f])[f]))}</div>`;
    return `<tr><th scope="row">${MERGE_LABELS[f]}</th>${plan.sorted.map(l => `<td data-label="${esc(l.name)}">${esc(mergeShow(f, l[f]))}</td>`).join('')}<td class="after" data-label="After merge">${after}</td></tr>`;
  };
  openModal(`Merge ${leads.length} leads`, `
    <p>The timelines are combined into one lead (${plural(acts, 'activity', 'activities')} and ${plural(opps, 'deal', 'deals')} in total). For each field the most recently updated value is selected, and you can choose a different one.</p>
    <div class="table-wrap" style="margin-top:12px"><table class="merge-table">
      <thead><tr><th></th>${plan.sorted.map(l => `<th>${esc(l.name)}<div class="cell-sub">Created ${fmtDate(l.createdAt)}</div></th>`).join('')}<th>After merge</th></tr></thead>
      <tbody>${MERGE_FIELDS.map(row).join('')}</tbody>
    </table></div>
    <p class="muted" style="margin-top:12px">${esc(plan.survivor.name)} (the earliest lead) is kept. Source and first-touch details come from it. Any other emails and phone numbers are kept as additional ones, and notes are combined. This can't be undone.</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="mergeDo('${[...ids].join(',')}')">${icon('merge')}Merge ${leads.length} leads</button>`, 'wide');
}

const uniqueBy = (arr, key) => { const seen = new Set(); return arr.filter(v => { const k = key(v); if (seen.has(k)) return false; seen.add(k); return true; }); };
function mergeDo(csv) {
  const leads = mergeLeads(csv);
  if (!leads) return;
  const plan = mergePlan(leads), choice = { ...plan.choice };
  // Use what the person picked in the dropdowns; fall back to the proposed value where there was no dropdown.
  MERGE_FIELDS.forEach(f => { const el = document.getElementById('mg-' + f); if (el && leads.some(l => l.id === el.value)) choice[f] = el.value; });
  const picks = {}, stamps = {};
  MERGE_FIELDS.forEach(f => { const src = leads.find(l => l.id === choice[f]); picks[f] = src[f]; stamps[f] = fieldStamp(src, f); });
  const { survivor, others } = plan, gone = new Set(others.map(l => l.id));
  const acts = DB.activities.filter(x => gone.has(x.leadId)), opps = DB.opps.filter(o => gone.has(o.leadId));
  acts.forEach(x => { x.leadId = survivor.id; });
  opps.forEach(o => { o.leadId = survivor.id; });
  // Nothing is lost: every other email and phone number from the merged leads is kept as an additional one.
  // A demoted primary becomes "Secondary"; additional ones keep the titles people gave them.
  const entries = field => leads.flatMap(l => [{ label: 'Secondary', value: l[field], primary: true }, ...(l[field === 'email' ? 'moreEmails' : 'morePhones'] || [])]).filter(x => x.value);
  const allEmails = entries('email'), allPhones = entries('phone');
  const chosen = f => leads.find(l => l.id === choice[f]);
  MERGE_FIELDS.forEach(f => { survivor[f] = picks[f]; });
  survivor.lostReason = survivor.status === 'Lost' ? chosen('status').lostReason || '' : ''; survivor.lostNote = survivor.status === 'Lost' ? chosen('status').lostNote || '' : '';
  survivor.emailLabel = chosen('email').emailLabel || 'Primary'; survivor.phoneLabel = chosen('phone').phoneLabel || 'Primary';
  survivor.moreEmails = uniqueBy(allEmails.filter(x => emailKey(x.value) !== emailKey(survivor.email)).map(x => ({ label: x.label, value: x.value.toLowerCase() })), x => emailKey(x.value));
  survivor.morePhones = uniqueBy(allPhones.filter(x => x.value !== survivor.phone && !(phoneKey(x.value) && phoneKey(x.value) === phoneKey(survivor.phone))).map(x => ({ label: x.label, value: x.value })), x => phoneKey(x.value) || x.value);
  // Notes are never dropped: the survivor's come first, then each other lead's that isn't already in them.
  survivor.notes = uniqueBy(leads.map(l => (l.notes || '').trim()).filter(Boolean), x => x).join('\n\n');
  survivor.fieldUpdated = { ...stamps };
  if (others.some(l => l.origin === 'tracked')) survivor.origin = 'tracked';   // a lead that came from tracking stays system-created
  DB.leads = DB.leads.filter(x => !gone.has(x.id));
  state.ui.selected = state.ui.selected.filter(id => !gone.has(id));
  logActivity(survivor.id, 'merged', 'Leads merged', `Merged with ${others.map(l => `${l.name} (${l.id})`).join(', ')}. Combined ${plural(acts.length, 'activity', 'activities')} and ${plural(opps.length, 'deal', 'deals')}.`);
  closeModal();
  toast(`${leads.length} leads merged`);
  navigate('#/leads/' + survivor.id);
}

// ---- Incoming leads ---------------------------------------------------------
// A real build would receive these from click tracking and the chat, form and call integrations.
// Here the prototype toolbar simulates one, so the matching rules can be tried.

function trackedClicks(source, a) {
  const out = [];
  const visit = visitMeta(source, a);
  if (source === 'Google Ads' || source === 'Meta Ads') out.push(['ad_click', `Clicked ${source} ad`, [a.campaign, a.ad, a.keyword && `“${a.keyword}”`].filter(Boolean).join(' · '), visit]);
  else if (source === 'Organic Search') out.push(['search', 'Arrived from organic search', a.keyword ? `Searched “${a.keyword}”` : '', visit]);
  else if (source === 'Referral') out.push(['referral', 'Arrived from a referral link', a.referrer || '', visit]);
  else if (source === 'Email') out.push(['email_click', 'Clicked an email link', a.campaign || '', visit]);
  else out.push(['direct', 'Visited the site directly', '', visit]);
  if (a.landingPage) out.push(['page_view', 'Viewed page', a.landingPage, { landing: true }]);
  return out;
}

// Adds a new lead, or, when the email or phone number already belongs to a lead, adds the activity to that lead's timeline.
// Matching runs over every lead in the organisation, whoever is looking at the screen.
function receiveLead(p) {
  const email = emailKey(p.email), phone = phoneKey(p.phone);
  const match = (email && DB.leads.find(l => emailsOf(l).some(e => emailKey(e) === email))) || (phone && DB.leads.find(l => phonesOf(l).some(x => phoneKey(x) === phone))) || null;
  const now = Date.now(), MIN = 6e4;
  const add = (leadId, at, type, title, detail, meta) => DB.activities.push({ id: 'a' + (++DB.seq), seq: DB.seq, leadId, at, type, title, detail: detail || '', by: null, meta: meta || null });
  const attribution = Object.fromEntries(ATTR_FIELDS.map(f => [f.key, p.attribution ? (p.attribution[f.key] || '') : '']));
  let lead = match, matchBy = '', filled = [];

  if (!match) {
    const id = 'L' + (1001 + DB.leads.length) + '-' + (++DB.seq);
    lead = { id, name: p.name || 'Unknown', email: email, phone: p.phone || '', notes: '', emailLabel: 'Primary', phoneLabel: 'Primary', moreEmails: [], morePhones: [], status: 'New', source: p.source, attribution, contactChannel: p.channel, createdAt: now, assigneeId: null, origin: 'tracked', fieldUpdated: Object.fromEntries(MERGE_FIELDS.map(f => [f, now])) };
    DB.leads.push(lead);
  } else {
    const byEmail = email && emailsOf(match).some(e => emailKey(e) === email), byPhone = phone && phonesOf(match).some(x => phoneKey(x) === phone);
    matchBy = byEmail && byPhone ? 'email and phone number' : byEmail ? 'email' : 'phone number';
    // Only fill gaps; never overwrite what the lead already has.
    if (!match.email && email) { match.email = email; stamp(match, 'email'); filled.push('email'); }
    if (!match.phone && p.phone) { match.phone = p.phone; stamp(match, 'phone'); filled.push('phone number'); }
    // A different email or number from the same person is kept as an additional one.
    if (email && !emailsOf(match).some(e => emailKey(e) === email)) { match.moreEmails = [...(match.moreEmails || []), { label: 'Secondary', value: email }]; filled.push('additional email'); }
    if (p.phone && !phonesOf(match).some(x => x === p.phone || (phoneKey(x) && phoneKey(x) === phoneKey(p.phone)))) { match.morePhones = [...(match.morePhones || []), { label: 'Secondary', value: p.phone }]; filled.push('additional phone number'); }
  }

  trackedClicks(p.source, attribution).forEach(([type, title, detail, meta], i, all) => add(lead.id, now - (all.length - i + 1) * MIN, type, title, detail, meta));
  if (match) {
    add(lead.id, now - MIN, 'conversation_started', `Contacted again via ${p.channel}`, `Matched to this lead by ${matchBy}, so no new lead was created.`, { channel: p.channel });
    if (filled.length) add(lead.id, now, 'lead_updated', 'Details updated', `Added ${filled.join(' and ')} from the new submission.`);
  } else {
    add(lead.id, now - MIN, 'conversation_started', `Started a conversation via ${p.channel}`, 'Earlier tracked clicks were matched to this contact.', { channel: p.channel });
    add(lead.id, now, 'lead_created', 'Lead created automatically', `Identified by ${email ? 'email' : 'phone number'}`);
  }
  return { lead, created: !match, matchBy, filled };
}

function intakeOpen() {
  openModal('Simulate incoming lead', `
    <p class="muted" style="margin-bottom:14px">Prototype only. This stands in for a form, call or chat arriving from tracking. If the email or phone number matches an existing lead, the activity is added to that lead's timeline instead of creating a new lead.</p>
    <div class="form-grid">

      ${fieldHTML('Source', 'in-source', selectHTML('in-source', TRACKED_SOURCES, 'Google Ads', `onchange="attrToggle('in', this.value)"`))}
      ${fieldHTML('Contacted us via', 'in-channel', selectHTML('in-channel', CONTACT_CHANNELS.filter(c => c !== 'In person'), 'Web form'))}

function intakeSubmit() {
  const source = val('in-source'), email = val('in-email'), phone = val('in-phone');

}

// ---- src/journey.js ----
// Customer journey: the tracked visits and clicks that led up to the first conversation, shown as touchpoints.

const TOUCH_TYPES = ['ad_click', 'search', 'referral', 'email_click', 'direct', 'recorded'];
const TOUCH_FALLBACK = { recorded: 'Recorded by hand', ad_click: 'Ad click', search: 'Organic Search', referral: 'Referral', email_click: 'Email', direct: 'Direct' };
// How the first conversation reads in the summary line, by the channel the person used.
const CHANNEL_VERB = { 'WhatsApp': 'Messaged', 'Live chat': 'Messaged', 'Phone call': 'Called', 'Web form': 'Submitted a form', 'Email': 'Emailed' };

// Groups a lead's tracked events, oldest first, into touchpoints, runs of browsed pages, and conversations.
// A landing page is already shown on its touchpoint, so it is not counted again as a browsed page.
function journeyOf(leadId) {
  const steps = trackedSteps(leadId), l = DB.leads.find(x => x.id === leadId);
  // A lead with no tracked visit but a recorded origin (Walk-in, Event, Personal referral, Phone enquiry) has that origin as its one touch,
  // dated when the lead was added. Tracked touches always win; a recorded one is only a stand-in.
  if (l && !steps.some(s => s.kind === 'touch') && MANUAL_SOURCES.includes(l.source)) {
    const by = (DB.activities.find(a => a.leadId === leadId && a.type === 'lead_created') || {}).by || '';
    steps.unshift({ kind: 'touch', e: { id: 'rec-' + leadId, seq: 0, leadId, at: l.createdAt, type: 'recorded', title: l.source, detail: '', by: null, meta: { label: l.source, detail: l.attribution.sourceDetail || '', recordedBy: by } } });
  }
  return steps;
}
function trackedSteps(leadId) {
  const events = DB.activities.filter(e => e.leadId === leadId && (TRACKED_TYPES.includes(e.type) || e.type === 'conversation_started')).sort((a, b) => a.at - b.at || a.seq - b.seq);
  const steps = [];
  events.forEach(e => {
    if (TOUCH_TYPES.includes(e.type)) steps.push({ kind: 'touch', e });
    else if (e.type === 'conversation_started') steps.push({ kind: 'convo', e });
    else if (!(e.meta && e.meta.landing)) {
      const last = steps[steps.length - 1];
      if (last && last.kind === 'pages') last.list.push(e); else steps.push({ kind: 'pages', list: [e] });
    }
  });
  return steps;
}
const touchLabel = e => (e.meta && e.meta.label) || TOUCH_FALLBACK[e.type];

// First touch is the earliest visit. Last touch only exists once the lead has a deal: it is the latest visit before the first deal
// was made. A visit after that is never the last touch, and with no deal there is no last touch at all (`last` is null).
// Direct visits are skipped for last touch when an earlier visit by another channel exists. A recorded origin counts as a touch only when there are no tracked ones.
function journeyEnds(steps, leadId) {
  const touches = steps.filter(s => s.kind === 'touch').map(s => s.e);
  const deals = DB.opps.filter(o => o.leadId === leadId);
  const before = deals.length ? touches.filter(e => e.at <= Math.min(...deals.map(o => o.createdAt))) : [];
  // Last non-direct: a direct visit is usually someone returning, so it only takes the label when nothing else came before the deal.
  const pick = [...before].reverse().find(e => e.type !== 'direct') || before[before.length - 1] || null;
  return { touches, first: touches[0], last: pick };
}

function journeySummary(steps, leadId) {
  const { touches, first, last } = journeyEnds(steps, leadId), convo = steps.find(s => s.kind === 'convo');
  const headline = !last ? `First touch ${touchLabel(first)}.` : last === first ? `First and last touch ${touchLabel(first)}.` : `First touch ${touchLabel(first)}. Converted on ${touchLabel(last)}.`;
  const ads = touches.filter(e => e.type === 'ad_click').length, pages = steps.filter(s => s.kind === 'pages').reduce((n, s) => n + s.list.length, 0);
  const parts = [];
  if (first.type === 'recorded') parts.push('Recorded by hand');
  if (ads) parts.push(`Clicked ${plural(ads, 'ad', 'ads')}`);
  if (pages) parts.push(`Browsed ${plural(pages, 'page', 'pages')}`);
  if (convo) {
    const days = Math.floor((convo.e.at - first.at) / 864e5), channel = convo.e.meta && convo.e.meta.channel;
    parts.push(`${CHANNEL_VERB[channel] || 'Got in touch'} ${days < 1 ? 'the same day' : days + (days === 1 ? ' day later' : ' days later')}`);
  }
  return { headline, line: parts.join(' · ') };
}

// What the timeline shows: everything, or only the key moments when the summary has been clicked.
function timelineView(leadId) {
  const all = timelineOf(leadId), shown = state.ui.keyMoments ? all.filter(x => x.key) : all;
  return { html: shown.map(x => x.html).join(''), count: state.ui.keyMoments ? `${shown.length} of ${plural(all.length, 'activity', 'activities')} · Key moments only` : `${plural(all.length, 'activity', 'activities')} · Newest first` };
}
function journeyFocus(leadId) {
  state.ui.keyMoments = !state.ui.keyMoments;
  const v = timelineView(leadId);
  document.getElementById('timeline').innerHTML = v.html;
  document.getElementById('tl-count').textContent = v.count;
  document.getElementById('j-sum').outerHTML = journeySummaryHTML(leadId);
  refreshIcons();
}
function journeyToggle(leadId, gid) {
  const o = state.ui.journeyOpen, i = o.indexOf(gid);
  if (i < 0) o.push(gid); else o.splice(i, 1);
  document.getElementById('timeline').innerHTML = timelineView(leadId).html;
  refreshIcons();
}

// ---- Timeline entries for tracked visits --------------------------------------
// Tracked visits are drawn as a dot on the timeline line with a tinted card beside it, not as an icon circle.
function touchItemHTML(e, tag) {
  const m = e.meta || {};
  const pairs = [['Referred by', m.referrer], ['Landing page', m.landingPage], ['Campaign', m.campaign], ['Ad', m.ad], [e.type === 'search' ? 'Search term' : 'Keyword', m.keyword], ['Medium', m.medium], ['Source', m.source], ['Click ID', m.clickId], ['Details', m.detail], ['Recorded by', m.recordedBy]].filter(p => p[1]);
  return `<li class="tl-item is-journey"><span class="tl-dot"></span><div><div class="j-card">
    <div class="j-head">${activityIcon(e.type)}<span>${esc(touchLabel(e))}</span>${tag ? pill(tag) : ''}</div>
    <div class="tl-meta">${fmtDateTime(e.at)}</div>
    ${pairs.length ? `<dl class="kv j-kv">${pairs.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : e.detail ? `<div class="tl-detail">${esc(e.detail)}</div>` : ''}
  </div></div></li>`;
}
function pagesItemHTML(leadId, list) {
  const gid = list[0].id, open = state.ui.journeyOpen.includes(gid);
  return `<li class="tl-item is-journey is-pages"><span class="tl-dot"></span><div>
    <button class="j-toggle${open ? ' is-open' : ''}" onclick="journeyToggle('${leadId}', '${gid}')" aria-expanded="${open}">${icon('page_view')}<span>Browsed ${plural(list.length, 'page', 'pages')}</span>${icon('expand')}</button>
    ${open ? `<ul class="j-pages">${list.map(e => `<li><span>${esc(e.detail)}</span><span class="tl-meta">${fmtDateTime(e.at)}</span></li>`).join('')}</ul>` : ''}
  </div></li>`;
}

// The entry for the conversion: the first deal made for the lead (the same moment last touch is measured against).
function convertedEvent(leadId) {
  const first = DB.opps.filter(o => o.leadId === leadId).sort((a, b) => a.createdAt - b.createdAt)[0];
  if (!first) return null;
  const made = DB.activities.filter(a => a.leadId === leadId && a.type === 'opp_created').sort((a, b) => a.at - b.at || a.seq - b.seq);
  return made.find(a => a.meta && a.meta.oppId === first.id) || made[0] || null;
}

// Every entry of a lead's timeline, newest first. Tracked clicks become touchpoint entries and "Browsed N pages" groups;
// landing-page views are folded into their touchpoint. Everything else (conversation, notes, deals, edits) is a plain entry.
function timelineOf(leadId) {
  const all = DB.activities.filter(a => a.leadId === leadId), folded = new Set(), items = [];
  const steps = journeyOf(leadId), ends = steps.some(s => s.kind === 'touch') ? journeyEnds(steps, leadId) : null;
  // The visit that opened the journey is always labelled. The one that led to the first deal is labelled too, but only when there is a deal. A single visit can be both.
  const tagOf = e => !ends ? '' : ends.first === ends.last && e === ends.first ? 'First and last touch' : e === ends.first ? 'First touch' : e === ends.last ? 'Last touch' : '';
  steps.forEach(s => {
    if (s.kind === 'touch') { folded.add(s.e.id); items.push({ at: s.e.at, seq: s.e.seq, html: touchItemHTML(s.e, tagOf(s.e)), key: !!tagOf(s.e) }); }
    else if (s.kind === 'pages') { const last = s.list[s.list.length - 1]; s.list.forEach(e => folded.add(e.id)); items.push({ at: last.at, seq: last.seq, html: pagesItemHTML(leadId, s.list) }); }
  });
  all.forEach(e => { if (e.type === 'page_view' && e.meta && e.meta.landing) folded.add(e.id); });
  // The entries "key moments" keeps: first touch, last touch (with a deal) and the conversion itself.
  const conv = convertedEvent(leadId);
  all.filter(e => !folded.has(e.id)).forEach(e => items.push({ at: e.at, seq: e.seq, html: leadEventHTML(e, conv && e.id === conv.id ? 'Converted' : ''), key: !!(conv && e.id === conv.id) }));
  return items.sort((a, b) => b.at - a.at || b.seq - a.seq);
}

// The one-line story above the timeline: where they came from and how long it took them to get in touch.
function journeySummaryHTML(leadId) {
  const steps = journeyOf(leadId);
  if (!steps.some(s => s.kind === 'touch')) return '';
  const sum = journeySummary(steps, leadId);
  const on = state.ui.keyMoments;
  return `<button class="j-summary${on ? ' is-on' : ''}" id="j-sum" aria-pressed="${on}" onclick="journeyFocus('${leadId}')" title="${on ? 'Show all activity' : 'Show only the first touch, last touch and conversion'}">${icon('journey')}<div><div class="j-headline">${esc(sum.headline)}</div><div class="tl-meta">${esc(sum.line)}</div></div><span class="j-focus" aria-hidden="true">${icon('focus')}</span></button>`;
}


// ---- src/users.js ----
// Users page (admin only) and the prototype toolbar.

function usersPage() {
  if (!isAdmin()) { location.replace('#/leads'); return null; }
  const count = id => DB.leads.filter(l => l.assigneeId === id).length;
  return `
    <header class="page-head">
      <div><h1>Users</h1><p class="sub">Admins see every lead. Basic users see only the leads assigned to them.</p></div>
      <button class="btn btn-primary" onclick="userOpenAdd()">${icon('add')}Add user</button>
    </header>
    <section class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th class="hide-sm">Email</th><th>Role</th><th class="num">Leads assigned</th></tr></thead>
        <tbody>${DB.users.map(u => `<tr>
          <td><div class="cell-main">${esc(u.name)}${u.id === state.userId ? ' <span class="muted">(you)</span>' : ''}</div></td>
          <td class="hide-sm">${esc(u.email)}</td>
          <td>${u.id === state.userId ? pill('Admin') : selectHTML('role-' + u.id, [['admin', 'Admin'], ['basic', 'Basic']], u.role, `onchange="userSetRole('${u.id}', this.value)" aria-label="Role for ${esc(u.name)}" style="width:auto;min-width:110px"`)}</td>
          <td class="num">${count(u.id)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="count">You can't change your own role, so the organisation always has an admin.</div>
    </section>`;
}

function userSetRole(id, role) {
  const u = DB.users.find(x => x.id === id);
  u.role = role;
  toast(`${u.name} is now ${role === 'admin' ? 'an admin' : 'a basic user'}`);
  render();
}

function userOpenAdd() {
  openModal('Add user', `
    <div class="form-grid">
      ${fieldHTML('Name', 'nu-name', inputHTML('nu-name', '', 'required aria-required="true"'), '', '', true)}
      ${fieldHTML('Email', 'nu-email', inputHTML('nu-email', '', 'type="email" required aria-required="true"'), '', '', true)}
      ${fieldHTML('Role', 'nu-role', selectHTML('nu-role', [['basic', 'Basic'], ['admin', 'Admin']], 'basic'), 'span-2')}
    </div>
    <p class="form-error" id="nu-error" role="alert"></p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="userSaveNew()">Add user</button>`);
}

function userSaveNew() {
  const name = val('nu-name'), email = val('nu-email').toLowerCase();
  const err = !name ? 'Enter a name.' : !validEmail(email) ? 'Enter a valid email address.' : DB.users.some(u => u.email === email) ? 'A user with this email already exists.' : '';
  if (err) { document.getElementById('nu-error').textContent = err; return; }
  DB.users.push({ id: 'u' + (DB.users.length + 1) + '-' + (++DB.seq), name, email, role: val('nu-role') });
  closeModal();
  toast('User added');
  render();
}

// ---- Prototype toolbar (not part of the product) ----------------------------
function devbarHTML() {
  return `<span class="devbar-title">CRM Lite Demo <span class="tag">DEV</span></span>
    <label><span class="hide-sm">View as</span> <select onchange="devViewAs(this.value)" aria-label="View as user">${DB.users.map(u => `<option value="${u.id}"${u.id === state.userId ? ' selected' : ''}>${esc(u.name)} (${u.role === 'admin' ? 'Admin' : 'Basic'})</option>`).join('')}</select></label>
    <div class="devbar-toggles">
      <span class="lbl">Actions:</span>
      <button type="button" class="dev-toggle" onclick="intakeOpen()" aria-label="Simulate incoming lead">${icon('inbox')}<span class="hide-sm">Simulate incoming lead</span></button>
      <button type="button" class="dev-toggle" onclick="devReset()" aria-label="Reset data">${icon('reset')}<span class="hide-sm">Reset data</span></button>
    </div>`;
}

function devViewAs(id) {
  state.userId = id;
  state.ui.assignee = '';
  state.ui.selected = [];
  state.ui.editing = false;
  closeModal();
  render();
}

function devReset() {
  DB = seedData();
  state.userId = 'u1';
  Object.assign(state.ui, { q: '', status: '', source: '', assignee: '', oppStatus: '', editing: false, selected: [] });
  closeModal();
  toast('Data reset');
  navigate('#/leads');
}


// ---- src/app.js ----
// Start-up.
window.addEventListener('hashchange', () => { state.ui.editing = false; state.ui.keyMoments = false; state.ui.selected = []; state.ui.drpOpen = ''; closeModal(); render(); });
if (!location.hash) history.replaceState(null, '', '#/leads');
render();

</script>
